<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>
  
  <!-- Storage box icon -->
  <g filter="url(#shadow)">
    <!-- Box body -->
    <rect x="25" y="45" width="50" height="45" rx="4" fill="url(#boxGradient)"/>
    
    <!-- Box door -->
    <rect x="30" y="50" width="40" height="35" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
    
    <!-- Door handle -->
    <rect x="60" y="63" width="6" height="10" rx="2" fill="#667eea"/>
    
    <!-- Box roof -->
    <path d="M22 45 L50 28 L78 45 Z" fill="#555" opacity="0.2"/>
  </g>
  
  <!-- Calendar/Appointment icon -->
  <g transform="translate(60, 55)" filter="url(#shadow)">
    <rect x="0" y="0" width="38" height="36" rx="4" fill="white"/>
    <rect x="0" y="0" width="38" height="10" rx="4" fill="#4CAF50"/>
    <rect x="0" y="6" width="38" height="4" fill="#4CAF50"/>
    
    <!-- Calendar hooks -->
    <rect x="8" y="-3" width="4" height="8" rx="2" fill="#333"/>
    <rect x="26" y="-3" width="4" height="8" rx="2" fill="#333"/>
    
    <!-- Check mark -->
    <path d="M10 22 L16 28 L28 16" stroke="#4CAF50" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Availability indicator -->
  <circle cx="95" cy="95" r="12" fill="#4CAF50" stroke="white" stroke-width="3"/>
  <path d="M90 95 L93 98 L100 91" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
