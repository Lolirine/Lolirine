<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="poolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4DB"/>
      <stop offset="100%" style="stop-color:#0083B0"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#poolGradient)"/>
  
  <!-- Pool waves -->
  <path d="M20 55 Q32 45 44 55 T68 55 T92 55 T108 55" stroke="url(#waveGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M20 70 Q32 60 44 70 T68 70 T92 70 T108 70" stroke="url(#waveGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M20 85 Q32 75 44 85 T68 85 T92 85 T108 85" stroke="url(#waveGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Import arrow -->
  <g transform="translate(64, 38)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#ffffff" opacity="0.9"/>
    <path d="M0 -4 L0 8 M-5 3 L0 8 L5 3" stroke="#0083B0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Small pool ladder icon -->
  <g transform="translate(90, 95)" fill="#ffffff" opacity="0.8">
    <rect x="0" y="0" width="3" height="20" rx="1"/>
    <rect x="12" y="0" width="3" height="20" rx="1"/>
    <rect x="0" y="4" width="15" height="2" rx="1"/>
    <rect x="0" y="10" width="15" height="2" rx="1"/>
    <rect x="0" y="16" width="15" height="2" rx="1"/>
  </g>
</svg>
