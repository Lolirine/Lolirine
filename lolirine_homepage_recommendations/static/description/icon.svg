<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Water waves decoration -->
  <path d="M0 200 Q32 185, 64 200 T128 200 T192 200 T256 200 L256 256 L0 256 Z" fill="#0e7490" opacity="0.3"/>
  <path d="M0 215 Q32 200, 64 215 T128 215 T192 215 T256 215 L256 256 L0 256 Z" fill="#0e7490" opacity="0.2"/>
  
  <!-- Product cards representing recommendations -->
  <!-- Card 1 (left) -->
  <g transform="translate(25, 45)">
    <rect width="60" height="80" rx="6" fill="url(#cardGrad)" filter="drop-shadow(2px 2px 4px rgba(0,0,0,0.2))"/>
    <rect x="8" y="8" width="44" height="35" rx="3" fill="#e0f2fe"/>
    <circle cx="30" cy="25" r="12" fill="#38bdf8"/>
    <rect x="8" y="50" width="35" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="8" y="62" width="25" height="6" rx="2" fill="#22d3ee"/>
  </g>
  
  <!-- Card 2 (center, larger, featured) -->
  <g transform="translate(98, 30)">
    <rect width="70" height="95" rx="8" fill="url(#cardGrad)" filter="drop-shadow(3px 3px 6px rgba(0,0,0,0.25))"/>
    <rect x="10" y="10" width="50" height="42" rx="4" fill="#e0f2fe"/>
    <rect x="20" y="20" width="30" height="22" rx="2" fill="#06b6d4"/>
    <rect x="10" y="60" width="40" height="7" rx="2" fill="#cbd5e1"/>
    <rect x="10" y="73" width="30" height="7" rx="2" fill="#22d3ee"/>
    <!-- Star rating -->
    <g transform="translate(10, 85)">
      <polygon points="5,0 6.5,3 10,3.5 7.5,6 8,10 5,8 2,10 2.5,6 0,3.5 3.5,3" fill="#fbbf24" transform="scale(0.8)"/>
      <polygon points="5,0 6.5,3 10,3.5 7.5,6 8,10 5,8 2,10 2.5,6 0,3.5 3.5,3" fill="#fbbf24" transform="translate(10,0) scale(0.8)"/>
      <polygon points="5,0 6.5,3 10,3.5 7.5,6 8,10 5,8 2,10 2.5,6 0,3.5 3.5,3" fill="#fbbf24" transform="translate(20,0) scale(0.8)"/>
      <polygon points="5,0 6.5,3 10,3.5 7.5,6 8,10 5,8 2,10 2.5,6 0,3.5 3.5,3" fill="#fbbf24" transform="translate(30,0) scale(0.8)"/>
      <polygon points="5,0 6.5,3 10,3.5 7.5,6 8,10 5,8 2,10 2.5,6 0,3.5 3.5,3" fill="#e5e7eb" transform="translate(40,0) scale(0.8)"/>
    </g>
  </g>
  
  <!-- Card 3 (right) -->
  <g transform="translate(180, 45)">
    <rect width="60" height="80" rx="6" fill="url(#cardGrad)" filter="drop-shadow(2px 2px 4px rgba(0,0,0,0.2))"/>
    <rect x="8" y="8" width="44" height="35" rx="3" fill="#e0f2fe"/>
    <ellipse cx="30" cy="25" rx="15" ry="10" fill="#67e8f9"/>
    <rect x="8" y="50" width="35" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="8" y="62" width="25" height="6" rx="2" fill="#22d3ee"/>
  </g>
  
  <!-- Recommendation arrows/connections -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M85 85 Q98 75, 98 85" stroke-dasharray="4,2"/>
    <path d="M168 85 Q180 75, 180 85" stroke-dasharray="4,2"/>
  </g>
  
  <!-- AI/Smart icon (sparkle) -->
  <g transform="translate(200, 145)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" opacity="0.9"/>
    <path d="M20 8 L22 16 L30 18 L22 20 L20 28 L18 20 L10 18 L18 16 Z" fill="#f59e0b"/>
    <circle cx="28" cy="10" r="3" fill="#fbbf24"/>
    <circle cx="12" cy="26" r="2" fill="#fcd34d"/>
  </g>
  
  <!-- "POOL" text hint -->
  <text x="128" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">POOL</text>
  
  <!-- Bottom label -->
  <rect x="50" y="185" width="156" height="24" rx="12" fill="#ffffff" opacity="0.15"/>
  <text x="128" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Recommandations</text>
</svg>