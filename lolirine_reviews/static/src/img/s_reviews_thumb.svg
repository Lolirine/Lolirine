<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100" height="70">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f6"/>
      <stop offset="100%" style="stop-color:#f0eeec"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fafafa"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C91E18"/>
      <stop offset="100%" style="stop-color:#a11813"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="70" fill="url(#bgGrad)" rx="4"/>
  
  <!-- Title area -->
  <rect x="30" y="6" width="40" height="3" fill="#1a1a1a" rx="1.5"/>
  <rect x="38" y="11" width="24" height="2" fill="#C91E18" rx="1" opacity="0.7"/>
  
  <!-- Stars -->
  <g fill="#f59e0b" transform="translate(35, 15)">
    <polygon points="3,0 3.9,2.4 6,2.4 4.2,3.9 4.8,6 3,4.8 1.2,6 1.8,3.9 0,2.4 2.1,2.4" transform="scale(0.6)"/>
    <polygon points="3,0 3.9,2.4 6,2.4 4.2,3.9 4.8,6 3,4.8 1.2,6 1.8,3.9 0,2.4 2.1,2.4" transform="translate(5,0) scale(0.6)"/>
    <polygon points="3,0 3.9,2.4 6,2.4 4.2,3.9 4.8,6 3,4.8 1.2,6 1.8,3.9 0,2.4 2.1,2.4" transform="translate(10,0) scale(0.6)"/>
    <polygon points="3,0 3.9,2.4 6,2.4 4.2,3.9 4.8,6 3,4.8 1.2,6 1.8,3.9 0,2.4 2.1,2.4" transform="translate(15,0) scale(0.6)"/>
    <polygon points="3,0 3.9,2.4 6,2.4 4.2,3.9 4.8,6 3,4.8 1.2,6 1.8,3.9 0,2.4 2.1,2.4" transform="translate(20,0) scale(0.6)"/>
  </g>
  
  <!-- Card 1 -->
  <g transform="translate(5, 25)">
    <rect width="28" height="38" fill="url(#cardGrad)" rx="3" stroke="#e0e0e0" stroke-width="0.5"/>
    <circle cx="7" cy="8" r="4" fill="url(#avatarGrad)"/>
    <text x="7" y="9.5" font-size="4" fill="white" text-anchor="middle" font-weight="bold">JF</text>
    <rect x="13" y="5" width="10" height="2" fill="#333" rx="1"/>
    <rect x="13" y="9" width="8" height="1.5" fill="#888" rx="0.75"/>
    <g fill="#f59e0b" transform="translate(5, 14)">
      <circle cx="1" cy="1" r="1"/>
      <circle cx="4" cy="1" r="1"/>
      <circle cx="7" cy="1" r="1"/>
      <circle cx="10" cy="1" r="1"/>
      <circle cx="13" cy="1" r="1"/>
    </g>
    <rect x="5" y="19" width="18" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="22" width="16" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="25" width="14" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="31" width="12" height="4" fill="#C91E18" fill-opacity="0.15" rx="2"/>
    <text x="11" y="34" font-size="3" fill="#C91E18" text-anchor="middle">✓</text>
  </g>
  
  <!-- Card 2 -->
  <g transform="translate(36, 25)">
    <rect width="28" height="38" fill="url(#cardGrad)" rx="3" stroke="#e0e0e0" stroke-width="0.5"/>
    <circle cx="7" cy="8" r="4" fill="url(#avatarGrad)"/>
    <text x="7" y="9.5" font-size="4" fill="white" text-anchor="middle" font-weight="bold">CS</text>
    <rect x="13" y="5" width="10" height="2" fill="#333" rx="1"/>
    <rect x="13" y="9" width="8" height="1.5" fill="#888" rx="0.75"/>
    <g fill="#f59e0b" transform="translate(5, 14)">
      <circle cx="1" cy="1" r="1"/>
      <circle cx="4" cy="1" r="1"/>
      <circle cx="7" cy="1" r="1"/>
      <circle cx="10" cy="1" r="1"/>
      <circle cx="13" cy="1" r="1"/>
    </g>
    <rect x="5" y="19" width="18" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="22" width="15" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="25" width="17" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="31" width="12" height="4" fill="#C91E18" fill-opacity="0.15" rx="2"/>
    <text x="11" y="34" font-size="3" fill="#C91E18" text-anchor="middle">€</text>
  </g>
  
  <!-- Card 3 -->
  <g transform="translate(67, 25)">
    <rect width="28" height="38" fill="url(#cardGrad)" rx="3" stroke="#e0e0e0" stroke-width="0.5"/>
    <circle cx="7" cy="8" r="4" fill="url(#avatarGrad)"/>
    <text x="7" y="9.5" font-size="4" fill="white" text-anchor="middle" font-weight="bold">NH</text>
    <rect x="13" y="5" width="10" height="2" fill="#333" rx="1"/>
    <rect x="13" y="9" width="8" height="1.5" fill="#888" rx="0.75"/>
    <g fill="#f59e0b" transform="translate(5, 14)">
      <circle cx="1" cy="1" r="1"/>
      <circle cx="4" cy="1" r="1"/>
      <circle cx="7" cy="1" r="1"/>
      <circle cx="10" cy="1" r="1"/>
      <circle cx="13" cy="1" r="1"/>
    </g>
    <rect x="5" y="19" width="18" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="22" width="14" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="25" width="16" height="1.5" fill="#666" rx="0.75"/>
    <rect x="5" y="31" width="12" height="4" fill="#C91E18" fill-opacity="0.15" rx="2"/>
    <text x="11" y="34" font-size="3" fill="#C91E18" text-anchor="middle">♥</text>
  </g>
  
  <!-- Google badge -->
  <g transform="translate(4, 4)">
    <rect width="22" height="8" fill="white" rx="4" stroke="#e0e0e0" stroke-width="0.3"/>
    <circle cx="5" cy="4" r="2.5" fill="#4285F4"/>
    <text x="5" y="5.2" font-size="3" fill="white" text-anchor="middle" font-weight="bold">G</text>
    <text x="13" y="5" font-size="2.5" fill="#666" text-anchor="middle">Avis</text>
  </g>
</svg>
