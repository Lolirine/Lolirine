    <circle cx="20" cy="20" r="22" fill="#28a745"/>
    <rect x="8" y="8" width="24" height="24" rx="3" fill="#ffffff"/>
    <rect x="8" y="8" width="24" height="8" rx="3" fill="#28a745"/>
    <circle cx="14" cy="22" r="2" fill="#28a745"/>
    <circle cx="20" cy="22" r="2" fill="#28a745"/>
    <circle cx="26" cy="22" r="2" fill="#28a745"/>
