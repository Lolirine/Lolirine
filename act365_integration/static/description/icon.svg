<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd54f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90caf9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Lock body -->
  <rect x="38" y="48" width="52" height="40" rx="6" ry="6" fill="url(#lockGrad)"/>
  <rect x="42" y="52" width="44" height="32" rx="4" ry="4" fill="#0d47a1" opacity="0.3"/>
  
  <!-- Lock shackle -->
  <path d="M 48 48 L 48 36 C 48 24 80 24 80 36 L 80 48" 
        fill="none" 
        stroke="#e0e0e0" 
        stroke-width="8" 
        stroke-linecap="round"/>
  <path d="M 48 48 L 48 36 C 48 24 80 24 80 36 L 80 48" 
        fill="none" 
        stroke="#bdbdbd" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Key icon in center of lock -->
  <circle cx="64" cy="66" r="8" fill="url(#keyGrad)"/>
  <rect x="61" y="70" width="6" height="14" rx="2" fill="url(#keyGrad)"/>
  
  <!-- 365 text -->
  <text x="64" y="105" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">365</text>
  
  <!-- Small decorative elements -->
  <circle cx="28" cy="28" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="100" cy="100" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="96" cy="32" r="2" fill="#ffffff" opacity="0.3"/>
</svg>