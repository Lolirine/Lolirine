<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fond circulaire -->
  <circle cx="100" cy="100" r="95" fill="#f5f5f5" stroke="#f39c12" stroke-width="6"/>
  
  <!-- Corps du chariot -->
  <rect x="60" y="80" width="70" height="50" rx="5" fill="#f1c40f"/>
  <rect x="55" y="75" width="20" height="60" rx="3" fill="#e67e22"/>
  
  <!-- Mât de levage -->
  <rect x="125" y="40" width="8" height="95" fill="#7f8c8d"/>
  <rect x="120" y="50" width="18" height="10" fill="#95a5a6"/>
  <rect x="120" y="70" width="18" height="8" fill="#bdc3c7"/>
  
  <!-- Fourches -->
  <rect x="133" y="90" width="35" height="6" fill="#7f8c8d"/>
  <rect x="133" y="100" width="35" height="6" fill="#7f8c8d"/>
  
  <!-- Roues -->
  <circle cx="75" cy="140" r="15" fill="#2c3e50"/>
  <circle cx="75" cy="140" r="8" fill="#7f8c8d"/>
  <circle cx="115" cy="140" r="12" fill="#2c3e50"/>
  <circle cx="115" cy="140" r="6" fill="#7f8c8d"/>
  
  <!-- Siège -->
  <rect x="70" y="70" width="25" height="15" rx="3" fill="#2c3e50"/>
  <rect x="68" y="55" width="8" height="20" rx="2" fill="#2c3e50"/>
  
  <!-- Volant -->
  <circle cx="90" cy="85" r="8" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
</svg>
