<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fond -->
  <rect width="128" height="128" rx="16" fill="#3498db"/>
  
  <!-- Bâtiment principal -->
  <rect x="16" y="40" width="96" height="72" rx="4" fill="#ecf0f1"/>
  
  <!-- Toit -->
  <polygon points="64,12 12,44 116,44" fill="#2c3e50"/>
  <polygon points="64,18 20,44 108,44" fill="#34495e"/>
  
  <!-- Porte d'entrée -->
  <rect x="52" y="80" width="24" height="32" rx="2" fill="#e67e22"/>
  <circle cx="72" cy="98" r="2" fill="#c0392b"/>
  
  <!-- Rangée de boxes haut -->
  <rect x="22" y="48" width="18" height="14" rx="2" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <rect x="44" y="48" width="18" height="14" rx="2" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <rect x="66" y="48" width="18" height="14" rx="2" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <rect x="88" y="48" width="18" height="14" rx="2" fill="#f39c12" stroke="#d68910" stroke-width="1"/>
  
  <!-- Rangée de boxes bas -->
  <rect x="22" y="66" width="18" height="14" rx="2" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <rect x="44" y="66" width="18" height="14" rx="2" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <rect x="66" y="66" width="18" height="14" rx="2" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <rect x="88" y="66" width="18" height="14" rx="2" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  
  <!-- Numéros sur les boxes (haut) -->
  <text x="31" y="58" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">1</text>
  <text x="53" y="58" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">2</text>
  <text x="75" y="58" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">3</text>
  <text x="97" y="58" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Numéros sur les boxes (bas) -->
  <text x="31" y="76" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">5</text>
  <text x="53" y="76" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">6</text>
  <text x="75" y="76" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">7</text>
  <text x="97" y="76" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">8</text>
</svg>
