<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C91E18"/>
      <stop offset="100%" style="stop-color:#8b1510"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bgGrad)"/>
  
  <!-- Envelope body -->
  <rect x="24" y="40" width="80" height="56" rx="6" ry="6" fill="url(#envGrad)"/>
  
  <!-- Envelope flap (top triangle) -->
  <path d="M24 46 L64 72 L104 46 L104 40 L24 40 Z" fill="#ffffff"/>
  
  <!-- Envelope fold lines -->
  <path d="M24 46 L64 72 L104 46" fill="none" stroke="#C91E18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Small decorative lines on envelope -->
  <line x1="34" y1="80" x2="54" y2="80" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="86" x2="44" y2="86" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Notification badge -->
  <circle cx="98" cy="36" r="16" fill="#27ae60"/>
  <path d="M91 36 L96 41 L106 31" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "L" letter accent -->
  <text x="64" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f5d5d4" text-anchor="middle">LOLIRINE</text>
</svg>
