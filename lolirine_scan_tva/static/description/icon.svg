<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="15" fill="#2E7D32"/>
  
  <!-- Scanner/Document shape -->
  <rect x="20" y="15" width="45" height="60" rx="3" fill="white" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- Lines on document -->
  <line x1="27" y1="28" x2="58" y2="28" stroke="#1B5E20" stroke-width="2"/>
  <line x1="27" y1="38" x2="58" y2="38" stroke="#1B5E20" stroke-width="2"/>
  <line x1="27" y1="48" x2="50" y2="48" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- TVA badge -->
  <circle cx="70" cy="65" r="22" fill="#FFC107"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">TVA</text>
  
  <!-- Scanner beam -->
  <rect x="15" y="75" width="55" height="4" fill="#4CAF50" opacity="0.8"/>
  <rect x="15" y="75" width="55" height="4" fill="url(#scanGradient)"/>
  
  <!-- Gradient for scanner effect -->
  <defs>
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#81C784;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Check mark -->
  <circle cx="55" cy="58" r="8" fill="#4CAF50"/>
  <polyline points="50,58 54,62 62,52" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
