<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.75"/>
    </linearGradient>
  </defs>
  <!-- Fond arrondi violet -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Bassin piscine -->
  <rect x="10" y="44" width="108" height="52" rx="9" fill="url(#water)"/>
  <!-- Bord haut et bas -->
  <rect x="6" y="37" width="116" height="12" rx="6" fill="#e0f2fe" opacity="0.95"/>
  <rect x="6" y="88" width="116" height="12" rx="6" fill="#e0f2fe" opacity="0.95"/>
  <!-- Vagues -->
  <path d="M18 63 Q32 56 46 63 Q60 70 74 63 Q88 56 102 63 Q110 67 116 65"
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M18 76 Q32 69 46 76 Q60 83 74 76 Q88 69 102 76 Q110 80 116 78"
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Document devis (coin haut droit) -->
  <rect x="76" y="5" width="46" height="46" rx="8" fill="white" opacity="0.95"/>
  <!-- Lignes doc -->
  <rect x="83" y="14" width="30" height="2.5" rx="1.2" fill="#7c3aed"/>
  <rect x="83" y="20" width="22" height="2.5" rx="1.2" fill="#7c3aed"/>
  <rect x="83" y="26" width="26" height="2.5" rx="1.2" fill="#7c3aed"/>
  <rect x="83" y="32" width="18" height="2.5" rx="1.2" fill="#7c3aed"/>
